name: main-workflow

on:
  push:
    branches:
      - main
    paths:
      - "vars/**/*.groovy"
      - "src/**/*.groovy"
      - "config/codenarc/**"
      - "config/spotbugs/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/main.yml"

  pull_request:
    paths:
      - "vars/**/*.groovy"
      - "src/**/*.groovy"
      - "config/codenarc/**"
      - "config/spotbugs/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/main.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Run CodeNarc and SpotBugs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"

      - name: Run CodeNarc and SpotBugs
        run: gradle codenarcMain spotbugsMain --continue --no-daemon

      - name: Upload CodeNarc report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codenarc-report
          path: build/reports/codenarc/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          if-no-files-found: warn
          retention-days: 14
